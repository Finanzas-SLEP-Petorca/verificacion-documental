<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificado de Ministro de Fe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{color-scheme:light}
  body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
  img{max-width:100%}
  [hidden]{display:none!important}

  :root{
    --bg:#F3F5F3;
    --surface:#FFFFFF;
    --surface-2:#EDF1EF;
    --ink:#17222B;
    --muted:#5C6B74;
    --line:#DCE3E1;
    --accent:#2C4A6E;
    --accent-ink:#FFFFFF;
    --accent-soft:#E6EDF3;
    --good:#2F7A52;
    --good-soft:#E3F3EA;
    --bad:#A6403A;
    --bad-soft:#FBEAE8;
    --warn:#94660F;
    --warn-soft:#FBF1DE;
    --shadow:0 1px 2px rgba(23,34,43,.07), 0 10px 28px rgba(23,34,43,.08);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161B;
      --surface:#182129;
      --surface-2:#1E2830;
      --ink:#E7ECEE;
      --muted:#96A4AD;
      --line:#2B3740;
      --accent:#87AEDA;
      --accent-ink:#0C1620;
      --accent-soft:#1E2F41;
      --good:#6FCB9A;
      --good-soft:#173229;
      --bad:#E48A82;
      --bad-soft:#3A211F;
      --warn:#E2B360;
      --warn-soft:#3A2E15;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161B;
    --surface:#182129;
    --surface-2:#1E2830;
    --ink:#E7ECEE;
    --muted:#96A4AD;
    --line:#2B3740;
    --accent:#87AEDA;
    --accent-ink:#0C1620;
    --accent-soft:#1E2F41;
    --good:#6FCB9A;
    --good-soft:#173229;
    --bad:#E48A82;
    --bad-soft:#3A211F;
    --warn:#E2B360;
    --warn-soft:#3A2E15;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Source Serif 4', Georgia, serif; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}

  .shell{max-width:920px; margin:0 auto; padding:28px 20px 64px;}

  .masthead{
    display:flex; align-items:center; gap:16px;
    padding-bottom:20px; margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .masthead img{width:46px; height:44px; object-fit:contain; flex-shrink:0;}
  .masthead .org{
    font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); margin-bottom:2px;
  }
  .masthead h1{font-size:26px; font-weight:600; color:var(--ink);}
  .masthead .sub{font-size:14px; color:var(--muted); font-style:italic; margin-top:2px;}

  .tabbar{display:flex; gap:4px; margin-bottom:24px; border-bottom:1px solid var(--line);}
  .tabbtn{
    appearance:none; background:none; border:none; cursor:pointer;
    font-family:'Public Sans', sans-serif; font-size:14.5px; font-weight:600;
    color:var(--muted); padding:10px 6px; margin-right:22px;
    border-bottom:2px solid transparent; margin-bottom:-1px;
    transition:color .15s ease, border-color .15s ease;
  }
  .tabbtn:hover{color:var(--ink);}
  .tabbtn.active{color:var(--accent); border-bottom-color:var(--accent);}
  .tabbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:28px;
  }

  .stepper{display:flex; align-items:center; gap:0; margin-bottom:28px;}
  .step-node{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .step-circle{
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; border:1.5px solid var(--line); color:var(--muted);
    background:var(--surface); flex-shrink:0; transition:all .15s ease;
  }
  .step-node.active .step-circle{border-color:var(--accent); background:var(--accent); color:var(--accent-ink);}
  .step-node.done .step-circle{border-color:var(--good); background:var(--good-soft); color:var(--good);}
  .step-label{font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap;}
  .step-node.active .step-label{color:var(--ink);}
  .step-line{flex:1 1 auto; height:1.5px; background:var(--line); margin:0 12px; min-width:16px;}
  .step-line.done{background:var(--good);}

  h2.step-title{font-size:20px; font-weight:600; margin-bottom:4px;}
  .step-desc{font-size:14px; color:var(--muted); margin-bottom:22px;}

  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13.5px; font-weight:600; margin-bottom:6px;}
  .field input[type="text"], .field input[type="date"], .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--ink); font:inherit; font-size:14.5px;
  }
  .field input:focus-visible, .field select:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .hint{font-size:12.5px; color:var(--muted); margin-top:4px;}

  .chip-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px;}
  .chip{
    appearance:none; text-align:left; cursor:pointer; font:inherit;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:13px 14px; font-size:14px; font-weight:600;
    transition:border-color .15s ease, background .15s ease;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .note-panel{
    background:var(--surface-2); border-radius:8px; padding:14px 16px;
    font-size:13.5px; color:var(--muted); font-style:italic; margin-bottom:18px; line-height:1.55;
  }

  .checklist{display:flex; flex-direction:column; gap:2px; margin-bottom:8px;}
  .check-row{
    display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .check-row:last-child{border-bottom:none;}
  .check-doc{font-size:14px; line-height:1.4;}
  .check-doc .n{color:var(--muted); font-weight:600; margin-right:6px;}
  .segmented{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex-shrink:0;}
  .segmented button{
    appearance:none; border:none; background:var(--surface); color:var(--muted); cursor:pointer;
    font:inherit; font-size:12.5px; font-weight:700; padding:7px 12px; letter-spacing:.02em;
    border-left:1px solid var(--line);
  }
  .segmented button:first-child{border-left:none;}
  .segmented button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .segmented button.si.on{background:var(--good-soft); color:var(--good);}
  .segmented button.no.on{background:var(--bad-soft); color:var(--bad);}
  .segmented button.na.on{background:var(--surface-2); color:var(--ink);}
  .obs-row{grid-column:1 / -1; margin-top:-6px;}
  .obs-row input{
    width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:7px;
    background:var(--surface); color:var(--ink); font:inherit; font-size:13px;
  }
  .obs-row input::placeholder{color:var(--muted);}

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-2); border-radius:8px; padding:13px 16px; margin:18px 0 4px;
  }
  .toggle-row .txt{font-size:13.5px;}
  .toggle-row .txt b{display:block; font-size:14px; margin-bottom:2px;}
  .switch{
    appearance:none; width:42px; height:24px; border-radius:99px; border:1px solid var(--line);
    background:var(--surface); position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch::after{
    content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:var(--muted); transition:transform .15s ease, background .15s ease;
  }
  .switch.on{background:var(--accent-soft); border-color:var(--accent);}
  .switch.on::after{transform:translateX(18px); background:var(--accent);}

  .section-gap{margin-top:30px;}

  .decl-text{font-size:14.5px; line-height:1.65; margin-bottom:14px;}

  .actions{display:flex; justify-content:space-between; gap:12px; margin-top:28px; padding-top:20px; border-top:1px solid var(--line);}
  .btn{
    appearance:none; cursor:pointer; font:inherit; font-size:14px; font-weight:700;
    padding:11px 20px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    transition:background .15s ease, border-color .15s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn.primary:hover{opacity:.92;}
  .btn.primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn.ghost{background:none; border-color:transparent;}
  .btn-spacer{flex:1;}

  .banner{
    border-radius:8px; padding:12px 14px; font-size:13.5px; margin-bottom:18px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .banner.warn{background:var(--warn-soft); color:var(--warn);}
  .banner.bad{background:var(--bad-soft); color:var(--bad);}

  .success{text-align:center; padding:26px 10px;}
  .success .check{
    width:56px; height:56px; border-radius:50%; background:var(--good-soft); color:var(--good);
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:28px;
  }
  .success h2{font-size:21px; margin-bottom:8px;}
  .success p{color:var(--muted); font-size:14px; max-width:440px; margin:0 auto 22px;}

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700;
    padding:3px 9px; border-radius:99px; white-space:nowrap;
  }
  .badge.good{background:var(--good-soft); color:var(--good);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.bad{background:var(--bad-soft); color:var(--bad);}
  .badge.neutral{background:var(--surface-2); color:var(--muted);}

  .filters{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .filters select, .filters input{
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
    color:var(--ink); font:inherit; font-size:13.5px;
  }
  .filters input{flex:1; min-width:180px;}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px;}
  thead th{
    text-align:left; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); background:var(--surface-2); padding:10px 14px; white-space:nowrap;
  }
  tbody td{padding:11px 14px; border-top:1px solid var(--line); vertical-align:middle;}
  tbody tr{cursor:pointer;}
  tbody tr:hover td{background:var(--surface-2);}
  .empty-state{padding:48px 20px; text-align:center; color:var(--muted); font-size:14px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,14,18,.5); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius); max-width:640px; width:100%;
    padding:26px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; gap:12px;}
  .modal h3{font-size:19px;}
  .modal .close{
    appearance:none; border:none; background:var(--surface-2); color:var(--muted); cursor:pointer;
    width:30px; height:30px; border-radius:50%; font-size:15px; flex-shrink:0;
  }
  .modal dl{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px; margin-bottom:18px;}
  .modal dt{color:var(--muted); font-weight:600;}
  .modal dd{margin:0;}
  .modal .cat-block{margin-bottom:16px;}
  .modal .cat-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:8px;}
  .modal .mrow{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:7px 0; border-bottom:1px solid var(--line);}
  .modal .mrow:last-child{border-bottom:none;}
  .modal .mrow .obs{color:var(--muted); font-size:12.5px; font-style:italic;}

  .dtable-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; margin:10px 0 14px;}
  .dtable{width:100%; border-collapse:collapse; font-size:13.5px; min-width:600px;}
  .dtable thead th{
    text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); background:var(--surface-2); padding:9px 10px; white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  .dtable tbody td{padding:6px 8px; border-top:1px solid var(--line); vertical-align:middle;}
  .dtable td.n{width:34px; text-align:center; color:var(--muted); font-weight:600;}
  .dtable td.rm{width:34px; text-align:center;}
  .dtable input{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
    background:var(--surface); color:var(--ink); font:inherit; font-size:13px;
  }
  .dtable .rm-btn{
    appearance:none; border:none; background:none; color:var(--muted); cursor:pointer;
    font-size:14px; padding:4px; line-height:1;
  }
  .dtable .rm-btn:hover{color:var(--bad);}
  .dtable tr.total-row td{background:var(--surface-2); border-top:1px solid var(--line);}
  .dtable td.total-label{text-align:right; font-weight:700; padding-right:14px;}
  .dtable td.total-val{font-weight:700; font-family:var(--mono, ui-monospace, monospace);}

  @media(prefers-reduced-motion: reduce){ *{transition:none !important;} }

  @media (max-width:560px){
    .check-row{grid-template-columns:1fr;}
    .segmented{justify-self:start;}
    .stepper{overflow-x:auto;}
  }
</style>
</head>

function itemKey(tipo, idx, compl){ return tipo + (compl ? ":c:" : ":") + idx; }
function getEstado(tipo, idx, compl){
  const k = itemKey(tipo, idx, compl);
  return (wizard.checklist[k] || {}).estado || null;
}
function setEstado(tipo, idx, compl, val){
  const k = itemKey(tipo, idx, compl);
  if(!wizard.checklist[k]) wizard.checklist[k] = {estado:null, obs:""};
  wizard.checklist[k].estado = (wizard.checklist[k].estado === val) ? null : val;
  render();
}
function setObs(tipo, idx, compl, val){
  const k = itemKey(tipo, idx, compl);
  if(!wizard.checklist[k]) wizard.checklist[k] = {estado:null, obs:""};

}

/* ============================== HELPERS ============================== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function fmtDate(iso){
  if(!iso) return "—";
  try{
    const d = new Date(iso);
    return d.toLocaleDateString("es-CL", {day:"2-digit", month:"2-digit", year:"numeric"});
  }catch(e){ return iso; }
}
function tipoLabel(tipo){ return tipo ? CATEGORIES[tipo].label.replace(/\s*\(.+?\)\s*$/, "") : "—"; }
function parseMonto(v){
  if(v == null || v === "") return 0;
  const n = Number(String(v).replace(/[^0-9.-]/g, ""));
  return Number.isFinite(n) ? n : 0;
}
function fmtMonto(n){
  try{ return "$" + Math.round(n).toLocaleString("es-CL"); }
  catch(e){ return String(n); }
}
function detalleTotal(list){
  return (list || []).reduce((sum, d) => sum + parseMonto(d.monto), 0);
}

function activeItemKeys(tipo, complOn){
  const cat = CATEGORIES[tipo];
  const keys = cat.items.map((_,i)=>itemKey(tipo,i,false));
  if(cat.complementario && complOn){
    keys.push(...cat.complementario.items.map((_,i)=>itemKey(tipo,i,true)));
  }
  return keys;
}
function step2Complete(){
  if(!wizard.tipo) return false;
  const keys = activeItemKeys(wizard.tipo, wizard.complementarioOn);
  return keys.every(k => wizard.checklist[k] && wizard.checklist[k].estado);
}
function computeResultado(cert){
  const vals = Object.values(cert.checklist || {});
  if(vals.some(v => v.estado === "no")) return "bad";
  if(vals.some(v => v.obs && v.obs.trim())) return "warn";
  return "good";
}

/* ============================== PDF GENERATION ============================== */
const ESTADO_LABEL = { si: "SÍ", no: "NO", na: "N/A" };

function buildCertificadoPdf(cert){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 18;
  const maxW = pageW - marginX * 2;
  let y = 20;

  function ensureSpace(h){
    if(y + h > pageH - 16){ doc.addPage(); y = 20; }
  }
  function writeWrapped(text, opts = {}){
    const { size = 10, style = "normal", color = [23,34,43], gap = 4.6, indent = 0 } = opts;
    doc.setFont("helvetica", style);
    doc.setFontSize(size);
    doc.setTextColor(...color);
    const lines = doc.splitTextToSize(text, maxW - indent);
    lines.forEach(line => {
      ensureSpace(gap);
      doc.text(line, marginX + indent, y);
      y += gap;
    });
  }
  function heading(text, size = 12){
    ensureSpace(9);
    y += 2;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(size);
    doc.setTextColor(23,34,43);
    doc.text(text, marginX, y);
    y += 1.5;
    doc.setDrawColor(220,227,225);
    doc.line(marginX, y, pageW - marginX, y);
    y += 6;
  }
  function field(label, value){
    ensureSpace(6);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(23,34,43);
    doc.text(label + ":", marginX, y);
    const labelW = doc.getTextWidth(label + ":  ");
    doc.setFont("helvetica", "normal");
    const lines = doc.splitTextToSize(String(value || "—"), maxW - labelW);
    doc.text(lines[0] || "—", marginX + labelW, y);
    y += 5.2;
    for(let i=1;i<lines.length;i++){ ensureSpace(5); doc.text(lines[i], marginX + labelW, y); y += 5.2; }
  }
  function fieldRight(label, value){
    const rightX = pageW - marginX;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    const lines = doc.splitTextToSize(String(value || "—"), maxW * 0.6);
    ensureSpace(5.2 * lines.length);
    const labelText = label + ": ";
    doc.setFont("helvetica", "bold"); doc.setTextColor(23,34,43);
    const labelW = doc.getTextWidth(labelText);
    doc.setFont("helvetica", "normal");
    const firstW = doc.getTextWidth(lines[0] || "—");
    doc.setFont("helvetica", "bold");
    doc.text(labelText, rightX - labelW - firstW, y);
    doc.setFont("helvetica", "normal");
    doc.text(lines[0] || "—", rightX - firstW, y);
    y += 5.2;
    for(let i=1;i<lines.length;i++){
      const w = doc.getTextWidth(lines[i]);
      ensureSpace(5);
      doc.text(lines[i], rightX - w, y);
      y += 5.2;
    }
  }

  // Header
  const logoW = 42, logoH = 13.65; // proporción real del logo: 1000x325 px
  try{
    const img = document.querySelector(".masthead img");
    if(img && img.src) doc.addImage(img.src, "PNG", marginX, y, logoW, logoH);
  }catch(e){ /* ignore image failures */ }
  y += logoH + 6;
  doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(92,107,116);
  doc.text("SERVICIO LOCAL DE EDUCACIÓN PÚBLICA PETORCA", marginX, y);
  y += 7;
  doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(23,34,43);
  doc.text(`Certificado de Ministro de Fe — N° ${cert.folio || "—"}`, marginX, y);
  y += 6;
  doc.setFont("helvetica", "italic"); doc.setFontSize(9); doc.setTextColor(92,107,116);
  doc.text(cert.unidad || "—", marginX, y);
  y += 8;
  doc.setDrawColor(180,190,188);
  doc.line(marginX, y, pageW - marginX, y);
  y += 8;

  heading("I. Identificación del set de pago");
  field("Folio del certificado", cert.folio);
  field("Nombre de set de pago", cert.nombreSet);
  field("Unidad o establecimiento", cert.unidad);
  field("Tipo de set de pago", tipoLabel(cert.tipo));

  heading("II. Verificación documental");
  const cat = CATEGORIES[cert.tipo];
  function checklistBlock(src, compl){
    ensureSpace(8);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(23,34,43);
    const titleLines = doc.splitTextToSize(src.label, maxW);
    titleLines.forEach(l => { ensureSpace(5.5); doc.text(l, marginX, y); y += 5.5; });
    y += 0.5;
    if(src.note) { writeWrapped(src.note, { size: 8.5, style: "italic", color: [92,107,116], gap: 4 }); y += 2; }
    src.items.forEach((label, idx) => {
      const k = itemKey(cert.tipo, idx, compl);
      const v = (cert.checklist || {})[k] || {};
      const estado = ESTADO_LABEL[v.estado] || "—";
      const estColor = v.estado === "no" ? [166,64,58] : (v.estado === "si" ? [47,122,82] : [92,107,116]);
      ensureSpace(5.5);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(23,34,43);
      const numLabel = (idx+1) + ". " + label;
      const lines = doc.splitTextToSize(numLabel, maxW - 16);
      doc.text(lines[0], marginX, y);
      doc.setFont("helvetica", "bold"); doc.setTextColor(...estColor);
      doc.text(estado, pageW - marginX, y, { align: "right" });
      y += 4.8;
      for(let i=1;i<lines.length;i++){ ensureSpace(4.8); doc.setFont("helvetica","normal"); doc.setTextColor(23,34,43); doc.text(lines[i], marginX, y); y += 4.8; }
      if(v.obs && v.obs.trim()){
        writeWrapped("Obs.: " + v.obs.trim(), { size: 8.5, style: "italic", color: [92,107,116], gap: 4, indent: 4 });
      }
      y += 1.2;
    });
    y += 3;
  }
  checklistBlock(cat, false);
  const otrosIdxPdf = cat.items.indexOf("Otros");
  const otrosMarkedPdf = otrosIdxPdf >= 0 && ((cert.checklist||{})[itemKey(cert.tipo, otrosIdxPdf, false)]||{}).estado === "si";
  const otrosItemsPdf = (cert.otrosItems || []).filter(t => t && t.trim());
  if(otrosMarkedPdf && otrosItemsPdf.length){
    ensureSpace(8);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(23,34,43);
    doc.text('Detalle del ítem "Otros"', marginX, y);
    y += 6;
    otrosItemsPdf.forEach((texto, idx) => {
      const lines = doc.splitTextToSize(`${idx+1}. ${texto}`, maxW);
      lines.forEach(line => {
        ensureSpace(4.8);
        doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(23,34,43);
        doc.text(line, marginX, y);
        y += 4.8;
      });
    });
    y += 3;
  }
  if(cat.detalle && (cert.detalleDocs || []).length){
    ensureSpace(8);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(23,34,43);
    doc.text("Detalle de documentos, folios y montos", marginX, y);
    y += 6;
    const colX = { n: marginX, tipo: marginX + 8, folio: marginX + 78, fecha: marginX + 108, monto: pageW - marginX };
    doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(92,107,116);
    doc.text("N°", colX.n, y); doc.text("TIPO DE DOCUMENTO", colX.tipo, y); doc.text("FOLIO", colX.folio, y);
    doc.text("FECHA", colX.fecha, y); doc.text("MONTO", colX.monto, y, { align: "right" });
    y += 2; doc.setDrawColor(220,227,225); doc.line(marginX, y, pageW - marginX, y); y += 4.5;
    let total = 0;
    cert.detalleDocs.forEach((d, idx) => {
      ensureSpace(5.5);
      const monto = parseMonto(d.monto); total += monto;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(23,34,43);
      doc.text(String(idx+1), colX.n, y);
      doc.text(doc.splitTextToSize(d.tipo || "—", 66)[0] || "—", colX.tipo, y);
      doc.text(d.folio || "—", colX.folio, y);
      doc.text(fmtDate(d.fecha), colX.fecha, y);
      doc.text(fmtMonto(monto), colX.monto, y, { align: "right" });
      y += 4.8;
    });
    ensureSpace(6); doc.setDrawColor(220,227,225); doc.line(marginX, y, pageW - marginX, y); y += 4.5;
    doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(23,34,43);
    doc.text("Total", colX.fecha, y);
    doc.text(fmtMonto(total), colX.monto, y, { align: "right" });
    y += 8;
  }
  if(cert.complementarioOn && cat.complementario) checklistBlock(cat.complementario, true);

  heading("III. Declaración del Ministro o Ministra de Fe");
  writeWrapped(
    "El o la suscrito(a), en su calidad de ministro/a de fe designado(a) por Resolución Exenta N° 450, de 2026, de este Servicio Local, que aprueba el procedimiento de autentificación documental y respaldo de rendición de cuentas del Servicio Local de Educación Pública Petorca, en concordancia con los artículos 5° y 6° de dicho procedimiento y con el artículo 2 N°15 y el artículo 27 de la Resolución N° 2, de 2026, de la Contraloría General de la República, certifica que ha verificado la documentación del set de pago individualizado en el punto I, conforme al detalle señalado en el punto II.",
    { size: 9.5, gap: 4.6 }
  );
  y += 2;
  writeWrapped(
    "Esta certificación acredita exclusivamente la existencia, integridad y autenticidad de la documentación de respaldo del set de pago para efectos de su rendición de cuentas ante la Contraloría General de la República. El o la suscrito(a) declara no haber participado en la preparación, elaboración o tramitación del presente set de pago, en resguardo del principio de segregación de funciones establecido en el artículo 2° letra h) de la Resolución Exenta N° 450, de 2026.",
    { size: 9.5, gap: 4.6 }
  );
  y += 6;
  ensureSpace(4 * 5.2);
  fieldRight("Nombre completo", (cert.decl||{}).nombre);
  fieldRight("RUT", (cert.decl||{}).rut);
  fieldRight("Cargo / unidad", (cert.decl||{}).cargo);
  fieldRight("Fecha de certificación", fmtDate((cert.decl||{}).fecha || cert.createdAt));

  return doc;
}

function downloadCertificadoPdf(cert){
  pdfNotice = "";
  try{
    const doc = buildCertificadoPdf(cert);
    const safeName = (cert.nombreSet || "certificado").replace(/[^a-zA-Z0-9-_]+/g, "_").slice(0,60);
    doc.save(`certificado_${safeName}.pdf`);
    pdfNotice = "ok";
  }catch(e){
    pdfNotice = "No se pudo generar el PDF en este navegador. Intenta nuevamente.";
  }
  render();
}

}

function renderStep2(){

  }

  const otrosIdx = cat.items.indexOf("Otros");
  const otrosOn = otrosIdx >= 0 && getEstado(wizard.tipo, otrosIdx, false) === "si";
  let complBlock = "";

    <h2 class="step-title">II. Verificación documental</h2>
    <p class="step-desc">Marque "Sí" si el documento está presente e íntegro, "No" si falta o está incompleto, y "N/A" si no aplica al caso. El checklist mostrado corresponde al tipo de set de pago seleccionado en el paso I.</p>
    ${renderChecklistBlock(wizard.tipo, false)}
    ${otrosOn ? renderOtrosList() : ""}
    ${cat.detalle ? renderDetalleTable() : ""}
    ${complBlock}
    <div class="actions">
      <button class="btn" id="btn-back-2">Atrás</button>
      <div class="btn-spacer"></div>
      <button class="btn primary" id="btn-next-2" ${step2Complete()?"":"disabled"}>Siguiente</button>
    </div>
  `;
}

function renderStep3(){
  const d = wizard.decl;
  const ready = d.nombre.trim() && d.rut.trim() && d.cargo.trim() && d.fecha;
  return `
    <h2 class="step-title">III. Declaración del Ministro o Ministra de Fe</h2>
    <p class="decl-text">El o la suscrito(a), en su calidad de ministro/a de fe designado(a) por Resolución Exenta N° 450, de 2026, de este Servicio Local, que aprueba el procedimiento de autentificación documental y respaldo de rendición de cuentas del Servicio Local de Educación Pública Petorca, en concordancia con los artículos 5° y 6° de dicho procedimiento y con el artículo 2 N°15 y el artículo 27 de la Resolución N° 2, de 2026, de la Contraloría General de la República, certifica que ha verificado la documentación del set de pago individualizado en el punto I, conforme al detalle señalado en el punto II.</p>
    <p class="decl-text">Esta certificación acredita exclusivamente la existencia, integridad y autenticidad de la documentación de respaldo del set de pago para efectos de su rendición de cuentas ante la Contraloría General de la República. El o la suscrito(a) declara no haber participado en la preparación, elaboración o tramitación del presente set de pago, en resguardo del principio de segregación de funciones establecido en el artículo 2° letra h) de la Resolución Exenta N° 450, de 2026.</p>
    <div class="field">
      <label for="f-decl-nombre">Nombre completo</label>
      <input type="text" id="f-decl-nombre" value="${esc(d.nombre)}">
    </div>
    <div class="field">
      <label for="f-decl-rut">RUT</label>
      <input type="text" id="f-decl-rut" class="mono" value="${esc(d.rut)}" placeholder="12.345.678-9">
    </div>
    <div class="field">
      <label for="f-decl-cargo">Cargo / unidad</label>
      <input type="text" id="f-decl-cargo" value="${esc(d.cargo)}">
    </div>
    <div class="field">
      <label for="f-decl-fecha">Fecha de certificación</label>
      <input type="date" id="f-decl-fecha" value="${esc(d.fecha)}">
    </div>
    ${wizard.submitError ? `<div class="banner bad">${esc(wizard.submitError)}</div>` : ""}
    <div class="actions">
      <button class="btn" id="btn-back-3">Atrás</button>
      <div class="btn-spacer"></div>
      <button class="btn primary" id="btn-submit" ${(!ready || wizard.submitting)?"disabled":""}>${wizard.submitting ? "Enviando…" : "Firmar y enviar certificado"}</button>
    </div>
  `;
}

function renderStep4(){
  return `
    <div class="success">
      <div class="check">✓</div>
      <h2>Certificado generado</h2>
      <p>El certificado quedó guardado en el Registro de certificados de este navegador. Descarga el PDF, súbelo a <a href="https://firmagob.gob.cl" target="_blank" rel="noopener">FirmaGob</a> para firmarlo electrónicamente, y luego remítelo según el procedimiento vigente al Subdepartamento de Finanzas.</p>
      ${pdfNotice && pdfNotice !== "ok" ? `<div class="banner warn" style="text-align:left;">${esc(pdfNotice)}</div>` : ""}
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn" id="btn-download-pdf">${pdfNotice === "ok" ? "Descargar PDF nuevamente" : "Descargar PDF"}</button>
        <button class="btn primary" id="btn-new-cert">Generar otro certificado</button>
      </div>
    </div>
  `;
}

function renderNuevo(){
  const root = document.getElementById("view-root");
  let stepHtml = "";
  if(wizard.step === 1) stepHtml = renderStep1();
  else if(wizard.step === 2) stepHtml = renderStep2();
  else if(wizard.step === 3) stepHtml = renderStep3();
  else stepHtml = renderStep4();
  root.innerHTML = `<div class="card">${wizard.step<=3 ? renderStepper() : ""}${stepHtml}</div>`;
  attachNuevoHandlers();
}

function attachNuevoHandlers(){
  if(wizard.step === 1){
    document.getElementById("f-folio").oninput = e => { wizard.folio = e.target.value; syncNextBtn1(); };
    document.getElementById("f-nombre").oninput = e => { wizard.nombreSet = e.target.value; syncNextBtn1(); };
    document.getElementById("f-unidad").onchange = e => { wizard.unidad = e.target.value; syncNextBtn1(); };
    document.querySelectorAll(".chip").forEach(btn=>{
      btn.onclick = () => { wizard.tipo = btn.dataset.tipo; wizard.complementarioOn = false; wizard.checklist = {}; wizard.detalleDocs = []; wizard.otrosItems = []; render(); };
    });
    const nb = document.getElementById("btn-next-1");
    if(nb) nb.onclick = () => { wizard.step = 2; render(); };
  }
  if(wizard.step === 2){
    document.querySelectorAll(".segmented button").forEach(btn=>{
      btn.onclick = () => setEstado(btn.dataset.tipo, +btn.dataset.idx, btn.dataset.compl==="1", btn.dataset.val);
    });
    document.querySelectorAll("[data-obs-tipo]").forEach(inp=>{
      inp.oninput = () => setObs(inp.dataset.obsTipo, +inp.dataset.obsIdx, inp.dataset.obsCompl==="1", inp.value);
    });
    const tgl = document.getElementById("btn-toggle-compl");
    if(tgl) tgl.onclick = () => { wizard.complementarioOn = !wizard.complementarioOn; render(); };
    document.querySelectorAll("[data-det-field]").forEach(inp=>{
      inp.oninput = () => {
        const idx = +inp.dataset.detIdx;
        wizard.detalleDocs[idx][inp.dataset.detField] = inp.value;
        if(inp.dataset.detField === "monto"){
          const totalEl = document.getElementById("detalle-total");
          if(totalEl) totalEl.textContent = fmtMonto(detalleTotal(wizard.detalleDocs));
        }
      };
    });
    document.querySelectorAll("[data-det-remove]").forEach(btn=>{
      btn.onclick = () => { wizard.detalleDocs.splice(+btn.dataset.detRemove, 1); render(); };
    });
    const addDet = document.getElementById("btn-add-detalle");
    if(addDet) addDet.onclick = () => { wizard.detalleDocs.push({tipo:"", folio:"", fecha:"", monto:""}); render(); };
    document.querySelectorAll("[data-otros-idx]").forEach(inp=>{
      inp.oninput = () => { wizard.otrosItems[+inp.dataset.otrosIdx] = inp.value; };
    });
    document.querySelectorAll("[data-otros-remove]").forEach(btn=>{
      btn.onclick = () => { wizard.otrosItems.splice(+btn.dataset.otrosRemove, 1); render(); };
    });
    const addOtros = document.getElementById("btn-add-otros");
    if(addOtros) addOtros.onclick = () => { wizard.otrosItems.push(""); render(); };
    document.getElementById("btn-back-2").onclick = () => { wizard.step = 1; render(); };
    const nb = document.getElementById("btn-next-2");
    if(nb) nb.onclick = () => { wizard.step = 3; render(); };
  }
  if(wizard.step === 3){
    document.getElementById("f-decl-nombre").oninput = e => { wizard.decl.nombre = e.target.value; syncSubmitBtn(); };
    document.getElementById("f-decl-rut").oninput = e => { wizard.decl.rut = e.target.value; syncSubmitBtn(); };
    document.getElementById("f-decl-cargo").oninput = e => { wizard.decl.cargo = e.target.value; syncSubmitBtn(); };
    document.getElementById("f-decl-fecha").oninput = e => { wizard.decl.fecha = e.target.value; syncSubmitBtn(); };
    document.getElementById("btn-back-3").onclick = () => { wizard.step = 2; render(); };
    document.getElementById("btn-submit").onclick = submitCertificado;
  }
  if(wizard.step === 4){
    document.getElementById("btn-new-cert").onclick = () => { wizard = blankWizard(); lastSubmittedCert = null; pdfNotice = ""; render(); };
    document.getElementById("btn-download-pdf").onclick = () => { if(lastSubmittedCert) downloadCertificadoPdf(lastSubmittedCert); };
  }
}
function syncNextBtn1(){
  const nb = document.getElementById("btn-next-1");
  if(nb) nb.disabled = !(wizard.folio.trim() && wizard.nombreSet.trim() && wizard.unidad.trim() && wizard.tipo);
}
function syncSubmitBtn(){
  const b = document.getElementById("btn-submit");
  if(!b) return;
  const d = wizard.decl;
  b.disabled = !(d.nombre.trim() && d.rut.trim() && d.cargo.trim() && d.fecha) || wizard.submitting;
}

function submitCertificado(){
  wizard.submitting = true; wizard.submitError = "";
  render();
  const payload = {
    id: newId(),
    folio: wizard.folio,
    nombreSet: wizard.nombreSet,
    unidad: wizard.unidad,
    tipo: wizard.tipo,
    complementarioOn: wizard.complementarioOn,
    checklist: wizard.checklist,
    detalleDocs: wizard.detalleDocs,
    otrosItems: wizard.otrosItems,
    decl: wizard.decl,
    createdAt: new Date().toISOString(),
  };
  const ok = saveCertificados([payload, ...certificados]);
  if(ok){
    certificados = [payload, ...certificados];
    wizard.step = 4;
    lastSubmittedCert = payload;
    pdfNotice = "";
  } else {
    wizard.submitError = "No se pudo guardar el certificado en este navegador (almacenamiento local no disponible o lleno). Puedes descargar igualmente el PDF con los datos ingresados.";
    lastSubmittedCert = payload;
  }
  wizard.submitting = false;
  render();
  if(wizard.step === 4 && lastSubmittedCert){
    downloadCertificadoPdf(lastSubmittedCert);
  }
}

/* ============================== RENDER: REGISTRO ============================== */
let registroFilterTipo = "";
let registroFilterQuery = "";

function renderRegistro(){
  const root = document.getElementById("view-root");
  let rows = certificados.slice();
  if(registroFilterTipo) rows = rows.filter(c => c.tipo === registroFilterTipo);
  if(registroFilterQuery.trim()){
    const q = registroFilterQuery.trim().toLowerCase();
    rows = rows.filter(c => (c.nombreSet||"").toLowerCase().includes(q) || (c.unidad||"").toLowerCase().includes(q));
  }
  const tableBody = rows.map(c => {
    const res = computeResultado(c);
    const badgeCls = res === "bad" ? "bad" : (res === "warn" ? "warn" : "good");
    const badgeTxt = res === "bad" ? "Con hallazgos" : (res === "warn" ? "Con observaciones" : "Conforme");
    return `<tr data-id="${esc(c.id)}">
      <td class="mono">${fmtDate(c.createdAt)}</td>
      <td>${esc(c.unidad)}</td>
      <td>${esc(tipoLabel(c.tipo))}</td>
      <td>${esc(c.nombreSet)}</td>
      <td><span class="badge ${badgeCls}">${badgeTxt}</span></td>
      <td>${esc((c.decl||{}).nombre)}</td>
    </tr>`;
  }).join("");

  let body;
  if(rows.length === 0){
    body = `<div class="empty-state">${certificados.length === 0 ? "Todavía no se ha generado ningún certificado en este navegador." : "Ningún certificado coincide con el filtro aplicado."}</div>`;
  } else {
    body = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Fecha</th><th>Unidad</th><th>Tipo de set</th><th>Nombre de set</th><th>Resultado</th><th>Ministro/a de fe</th>
      </tr></thead>
      <tbody>${tableBody}</tbody>
    </table></div>`;
  }

  root.innerHTML = `
    <div class="card">
      <h2 class="step-title" style="margin-bottom:4px;">Registro de certificados</h2>
      <p class="step-desc">Certificados generados desde este navegador, ordenados por fecha. Este registro es local a este dispositivo: no se sincroniza automáticamente con otros equipos ni con Finanzas — cada certificado se comparte enviando el PDF firmado según el procedimiento vigente.</p>
      <div class="filters">
        <select id="rf-tipo">
          <option value="">Todos los tipos</option>
          ${TIPO_ORDER.map(t=>`<option value="${t}" ${registroFilterTipo===t?"selected":""}>${esc(CATEGORIES[t].label)}</option>`).join("")}
        </select>
        <input type="text" id="rf-query" placeholder="Buscar por unidad o nombre de set…" value="${esc(registroFilterQuery)}">
      </div>
      ${body}
    </div>
  `;
  document.getElementById("rf-tipo").onchange = e => { registroFilterTipo = e.target.value; renderRegistro(); };
  document.getElementById("rf-query").oninput = e => { registroFilterQuery = e.target.value; renderRegistro(); };
  document.querySelectorAll("tbody tr").forEach(tr=>{
    tr.onclick = () => { selectedCert = certificados.find(c=>c.id===tr.dataset.id); renderModal(); };
  });
}

function renderModal(){
  let existing = document.getElementById("cert-modal");
  if(existing) existing.remove();
  if(!selectedCert) return;
  const c = selectedCert;
  const cat = CATEGORIES[c.tipo];
  const catBlock = (src, compl) => {
    const rowsHtml = src.items.map((doc, idx)=>{
      const k = itemKey(c.tipo, idx, compl);
      const v = (c.checklist||{})[k] || {};
      const badgeCls = v.estado === "no" ? "bad" : (v.estado === "na" ? "neutral" : "good");
      const badgeTxt = v.estado === "si" ? "Sí" : (v.estado === "no" ? "No" : (v.estado === "na" ? "N/A" : "—"));
      return `<div class="mrow">
        <span>${esc(doc)}</span>
        <span style="display:flex; align-items:center; gap:8px;">${v.obs ? `<span class="obs">${esc(v.obs)}</span>`:""}<span class="badge ${badgeCls}">${badgeTxt}</span></span>
      </div>`;
    }).join("");
    return `<div class="cat-block"><div class="cat-title">${esc(src.label)}</div>${rowsHtml}</div>`;
  };
  const otrosBlock = () => {
    const otrosIdxModal = cat.items.indexOf("Otros");
    if(otrosIdxModal < 0) return "";
    const marked = ((c.checklist||{})[itemKey(c.tipo, otrosIdxModal, false)]||{}).estado === "si";
    const items = (c.otrosItems || []).filter(t => t && t.trim());
    if(!marked || !items.length) return "";
    const rowsHtml = items.map((t, idx) => `<div class="mrow"><span>${idx+1}. ${esc(t)}</span></div>`).join("");
    return `<div class="cat-block"><div class="cat-title">Detalle del ítem "Otros"</div>${rowsHtml}</div>`;
  };
  const detalleBlock = () => {
    if(!cat.detalle || !(c.detalleDocs || []).length) return "";
    const rowsHtml = c.detalleDocs.map((d, idx) => `<div class="mrow">
        <span>${idx+1}. ${esc(d.tipo || "—")} ${d.folio ? `<span class="obs">(folio ${esc(d.folio)})</span>` : ""}</span>
        <span>${esc(fmtMonto(parseMonto(d.monto)))}</span>
      </div>`).join("");
    return `<div class="cat-block">
      <div class="cat-title">Detalle de documentos, folios y montos</div>
      ${rowsHtml}
      <div class="mrow" style="font-weight:700;"><span>Total</span><span>${esc(fmtMonto(detalleTotal(c.detalleDocs)))}</span></div>
    </div>`;
  };
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "cert-modal";
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h3>${esc(c.nombreSet)}</h3>
        <button class="close" id="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <dl>
        <dt>Folio</dt><dd>${esc(c.folio)}</dd>
        <dt>Unidad</dt><dd>${esc(c.unidad)}</dd>
        <dt>Tipo de set</dt><dd>${esc(tipoLabel(c.tipo))}</dd>
        <dt>Fecha</dt><dd>${fmtDate(c.createdAt)}</dd>
        <dt>Ministro/a de fe</dt><dd>${esc((c.decl||{}).nombre)} — ${esc((c.decl||{}).cargo)}</dd>
        <dt>RUT</dt><dd class="mono">${esc((c.decl||{}).rut)}</dd>
      </dl>
      ${catBlock(cat, false)}
      ${otrosBlock()}
      ${detalleBlock()}
      ${c.complementarioOn && cat.complementario ? catBlock(cat.complementario, true) : ""}
      <div class="actions" style="margin-top:6px; padding-top:16px;">
        <div class="btn-spacer"></div>
        <button class="btn" id="modal-download-pdf">Descargar PDF</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close").onclick = () => { selectedCert=null; overlay.remove(); };
  overlay.onclick = (e) => { if(e.target === overlay){ selectedCert=null; overlay.remove(); } };
  document.getElementById("modal-download-pdf").onclick = () => downloadCertificadoPdf(c);
}

/* ============================== ROUTER ============================== */
function render(){
  document.getElementById("tab-nuevo").classList.toggle("active", currentTab==="nuevo");
  document.getElementById("tab-registro").classList.toggle("active", currentTab==="registro");
  if(currentTab === "nuevo") renderNuevo();
  else renderRegistro();
}
document.getElementById("tab-nuevo").onclick = () => { currentTab = "nuevo"; render(); };
document.getElementById("tab-registro").onclick = () => { currentTab = "registro"; render(); };

render();
</script>
</body>
</html>
